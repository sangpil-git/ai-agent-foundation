[tool.poetry]
name = "agent-foundation"
version = "0.1.0"
description = "LangChain/LangGraph 기반 에이전트 공용 프레임워크"
readme = "README.md"
package-mode = false  # 내부 서비스 프로젝트면 이게 가장 편함

[tool.poetry.dependencies]
python = ">=3.11,<4.0"

# --- Web Framework ---
fastapi = { version = ">=0.121.2,<0.123.0" }
uvicorn = { version = ">=0.38.0,<0.39.0", extras = ["standard"] }

# --- LangChain / LLM / Graph ---
langchain = "^1.1.0"
langchain-core = "^1.1.0"
langchain-community = "^0.3.31"
langchain-openai = "^1.1.0"
langchain-text-splitters = "^1.0.0"
langgraph = "^1.0.3"

# --- OpenAI SDK ---
openai = "^1.0.0"

# --- RAG / Storage ---
chromadb = "^0.5.0"
redis = "^5.0.0"
sqlalchemy = "^2.0.0"

# 문서/HTML 로더용 (PDF, 웹페이지 RAG 기본 뼈대)
pypdf = "^4.0.0"
beautifulsoup4 = "^4.12.0"
lxml = "^5.0.0"

# --- Config / Utils ---
httpx = "^0.28.1"
pydantic = "^2.12.4"
pydantic-settings = "^2.2.1"
python-dotenv = "^1.0.1"
structlog = "^24.1.0"

# LangSmith 트레이싱 & 평가용
langsmith = "^0.4.47"

# 토큰 카운팅 / 일부 임베딩 유틸
tiktoken = "^0.12.0"

# FastAPI 성능 및 파일 업로드
orjson = "^3.10.0"          # FastAPI response_model에 주로 사용
python-multipart = "^0.0.9" # 파일 업로드 엔드포인트가 있을 경우 필요

[tool.poetry.group.dev.dependencies]
pytest = "^8.2.0"
pytest-asyncio = "^0.24.0"

# 코드 스타일/품질 도구 (선택이지만 거의 필수 느낌)
black = "^24.0.0"
ruff = "^0.6.0"
mypy = "^1.11.0"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
