[project]
name = "agent-foundation"
version = "0.1.0"
description = "LangChain/LangGraph 기반 에이전트 공용 프레임워크"
readme = "README.md"

requires-python = ">=3.11"

dependencies = [
    "chromadb>=1.3.4",
    "fastapi>=0.121.2",
    "httpx>=0.28.1",
    "langchain>=1.0.5",
    "langchain-community>=0.4.1",
    "langchain-openai>=1.0.2",
    "langgraph>=1.0.3",
    "openai>=2.8.0",
    "pydantic>=2.12.4",
    "pydantic-settings>=2.12.0",
    "python-dotenv>=1.2.1",
    "structlog>=25.5.0",
    "uvicorn[standard]>=0.38.0",
    "redis",
    "sqlalchemy",
]

[project.scripts]
agent-foundation = "agent_foundation:main"

[project.optional-dependencies]
dev = [
  "pytest",
  "pytest-asyncio",
]

[tool.uv]  # uv 사용 시
dev-dependencies = ["pytest", "pytest-asyncio"]

[tool.pytest.ini_options]
pythonpath = ["."]

[build-system]
requires = ["uv_build>=0.9.9,<0.10.0"]
build-backend = "uv_build"