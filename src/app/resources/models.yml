#src/app/resources/models.yml
models:
  gpt-4.1-mini:
    provider: openai
    model: gpt-4.1-mini
    temperature: 0.2
    max_tokens: 4096
    api_key_env: OPENAI_API_KEY

  gpt-4.1-nano:
    provider: openai
    model: gpt-4.1-nano
    temperature: 0.2
    max_tokens: 4096
    api_key_env: OPENAI_API_KEY

  gpt-4o-mini:
    provider: openai
    model: gpt-4o-mini
    temperature: 0.3
    api_key_env: OPENAI_API_KEY

  gemini-1.5-flash:
    provider: gemini
    model: gemini-1.5-flash
    temperature: 0.3
    api_key_env: GOOGLE_API_KEY

  claude-3-5-sonnet:
    provider: anthropic
    model: claude-3-5-sonnet-20240620
    temperature: 0.3
    api_key_env: ANTHROPIC_API_KEY

  azure-gpt-4o-mini:
    provider: azure_openai
    deployment: gpt-4o-mini-deploy
    model: gpt-4o-mini
    temperature: 0.2
    api_key_env: AZURE_OPENAI_API_KEY

  llama3-8b-ollama:
    provider: ollama
    model: llama3:8b
    temperature: 0.3
    base_url: "http://localhost:11434"
